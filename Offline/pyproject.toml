[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hive-mem"
version = "0.1.0"
description = "HiveMem: attribute-graph memory system for multimodal conversational agents (Mem-Gallery harness included)"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.8.0,<3.0.0",
    "transformers>=4.57.1,<4.58",
    "torch>=2.1.0",
    "numpy>=1.24.0,<3.0.0",
    "json-repair>=0.28.0",
    "tiktoken>=0.7.0",
    "huggingface-hub>=0.23.0,<2.0.0",
    "safetensors>=0.4.0",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "nltk>=3.8.0",
    "wandb>=0.29.0,<0.30.0",
    "wandb-workspaces>=0.4.11,<0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
