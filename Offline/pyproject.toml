[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hive-mem"
version = "0.1.0"
description = "HiveMem: attribute-graph memory system for multimodal conversational agents (Mem-Gallery harness included)"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0,<2.0.0",
    "transformers>=4.57.1,<4.58",
    "torch>=2.1.0",
    "numpy>=1.24.0,<3.0.0",
    "json-repair>=0.28.0",
    "tiktoken>=0.7.0",
    "huggingface-hub>=0.23.0,<2.0.0",
    "safetensors>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
