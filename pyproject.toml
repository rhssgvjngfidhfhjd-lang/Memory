[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hive-mem"
version = "0.1.0"
description = "HiVe_mem: Horizontal Memory Expansion and Vertical Evidence Composition for multimodal agents"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "openai>=1.109.1,<3.0.0",
    "numpy>=1.24.0,<3.0.0",
    "json-repair>=0.28.0",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "packaging>=23.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
eval = ["nltk>=3.8.0", "tiktoken>=0.7.0", "transformers>=4.57.1,<4.58"]
train = ["torch>=2.1.0", "nltk>=3.8.0", "tiktoken>=0.7.0", "transformers>=4.57.1,<4.58"]
embedding = ["torch>=2.1.0", "transformers>=4.57.1,<4.58", "huggingface-hub>=0.23.0,<2.0.0", "safetensors>=0.4.0"]
data = ["huggingface-hub>=0.23.0,<2.0.0"]

[project.scripts]
hivemem-data = "embedding.cli:data_main"
hivemem-build = "src.build:main"
hivemem-policy = "evidence_policy.cli:main"
hivemem-judge = "benchmarks.judge:main"
hivemem-gvv = "gvv_extractor.__main__:main"

[tool.setuptools.package-data]
"benchmarks" = ["multimodal_split_manifest.json"]
"benchmarks.memgallery_harness" = ["profiles.json"]
"configs" = ["*.json"]
"gvv_extractor" = ["configs/*.json", "prompts/*.json"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "configs",
    "src", "src.*",
    "evidence_policy", "evidence_policy.*",
    "gvv_extractor", "gvv_extractor.*",
    "embedding", "embedding.*",
    "benchmarks", "benchmarks.*",
]
namespaces = false
